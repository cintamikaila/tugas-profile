<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Pribadi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #FAF5F7;
            color: #4A3E3D;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .profile-card {
            background-color: #ecaebb;
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(220, 180, 195, 0.25);
            border: 1px solid #F3E5EB;
            text-align: center;
        }

        .profile-photo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #F7D6E0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .profile-card h1 {
            color: #C0708D;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .motto-box {
            background-color: #FFF0F5;
            color: #A35C75;
            font-style: italic;
            padding: 10px 15px;
            border-radius: 12px;
            margin: 15px 0 25px 0;
            font-size: 0.95rem;
            border-left: 3px solid #E2A9BE;
        }

        .details-list {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 12px;
            border-bottom: 1px dashed #F2D8E3;
            font-size: 0.95rem;
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: 600;
            color: #A35C75;
            min-width: 120px;
        }

        .value {
            color: #5A4A4D;
            text-align: right;
            word-break: break-word;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .detail-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
            
            .value {
                text-align: left;
            }
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <img src="https://via.placeholder.com/150" alt="Foto Profil" class="profile-photo">

        <h1>Cinta Mikaila</h1>
        
        <div class="motto-box">
            "Just do it."
        </div>

        <div class="details-list">
            <div class="detail-item">
                <span class="label">Tempat, tanggal lahir</span>
                <span class="value">Bogor, 19 Desember 2010</span>
            </div>
            <div class="detail-item">
                <span class="label">Alamat</span>
                <span class="value">Kp.kedep Rt.01 Rw.20 Kec.GunungPutri Kab.Bogor</span>
            </div>
            <div class="detail-item">
                <span class="label">Email</span>
                <span class="value">cintamikaila777@email.com</span>
            </div>
            <div class="detail-item">
                <span class="label">Sekolah</span>
                <span class="value">SMKN 1 GunungPutri</span>
            </div>
            <div class="detail-item">
                <span class="label">Kelas</span>
                <span class="value">X RPL 3</span>
            </div>
            <div class="detail-item">
                <span class="label">Hobi</span>
                <span class="value">Membaca Novel</span>
            </div>
        </div>
    </div>

</body>
</html>
